[workspace]
members = [
    "crates/gmrf-core",
    "crates/gmrf-autodiff",
    "crates/gmrf-fem",
    "crates/gmrf-latent",
    "crates/gmrf-observation",
    "crates/gmrf-spde",
    "crates/gmrf-viz",
]
resolver = "2"

[workspace.package]
authors = ["GaussianMarkovRandomFields contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/JuliaGaussianProcesses/GaussianMarkovRandomFields"

[workspace.dependencies]
nalgebra = { version = "0.32", default-features = true }
nalgebra-sparse = "0.9"
rand = "0.8"
rand_distr = "0.4"
thiserror = "1.0"
criterion = "0.5"
