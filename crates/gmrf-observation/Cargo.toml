[package]
name = "gmrf-observation"
version = "0.1.0"
edition = "2021"
authors = ["GaussianMarkovRandomFields.jl contributors"]
license = "MIT"
description = "Observation model scaffolding for the Rust port of GaussianMarkovRandomFields.jl"
repository = "https://github.com/JuliaGaussianProcesses/GaussianMarkovRandomFields.jl"

[dependencies]
gmrf-core = { path = "../gmrf-core" }
faer.workspace = true
thiserror.workspace = true

[features]
autodiff = ["gmrf-autodiff"]

[dependencies.gmrf-autodiff]
path = "../gmrf-autodiff"
optional = true
