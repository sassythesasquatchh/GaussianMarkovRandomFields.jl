[package]
name = "gmrf-spde"
version = "0.1.0"
edition = "2021"
authors = ["GaussianMarkovRandomFields.jl contributors"]
license = "MIT"
description = "SPDE discretizations for the Rust port of GaussianMarkovRandomFields.jl"
repository = "https://github.com/JuliaGaussianProcesses/GaussianMarkovRandomFields.jl"

[dependencies]
faer.workspace = true
gmrf-core = { path = "../gmrf-core" }
gmrf-fem = { path = "../gmrf-fem" }
statrs = "0.16"
thiserror.workspace = true

[dev-dependencies]
rand.workspace = true
rand_distr.workspace = true
